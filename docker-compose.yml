services:
  # Наш бот
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # URL Local Bot API (контейнер bot-api) — файлы до 2 ГБ
      BOT_API_URL: http://bot-api:8081
    depends_on:
      postgres:
        condition: service_healthy
      bot-api:
        condition: service_healthy
    volumes:
      # tmp для обрабатываемых фото (не занимает место в контейнере)
      - /tmp/upscaler:/tmp/upscaler
      # доступ к файлам Local Bot API
      - bot-api-data:/var/lib/telegram-bot-api

  # Local Bot API — файлы до 2 ГБ без ограничений
  bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: 1
    ports:
      - "${BOT_API_PORT:-8085}:8081"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
      - /tmp/upscaler:/tmp/upscaler
    healthcheck:
      # bot-api слушает 8081 внутри контейнера; в alpine-образе нет bash/curl, но есть nc
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Автоперезапуск unhealthy контейнеров
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bot_4_upscaler}
      POSTGRES_USER: ${DB_USER:-bot_4_upscaler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bot_4_upscaler} -d ${DB_NAME:-bot_4_upscaler}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  bot-api-data:
